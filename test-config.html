<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase配置测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Supabase配置测试</h1>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Supabase URL</label>
        <input type="text" id="supabaseUrl" 
               placeholder="https://your-project-ref.supabase.co"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Anon Key</label>
        <textarea id="supabaseKey" 
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-24 resize-none"></textarea>
      </div>
      
      <button onclick="testConnection()" 
              class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
        测试连接
      </button>
      
      <div id="result" class="hidden p-4 rounded-md">
        <div id="resultContent"></div>
      </div>
      
      <div class="text-sm text-gray-600">
        <p class="mb-2"><strong>说明：</strong></p>
        <ul class="list-disc list-inside space-y-1">
          <li>在Supabase项目设置 > API中找到这些信息</li>
          <li>确保已执行 supabase-setup.sql 脚本</li>
          <li>测试成功后，将配置复制到主应用中</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    let supabase = null;
    
    async function testConnection() {
      const url = document.getElementById('supabaseUrl').value.trim();
      const key = document.getElementById('supabaseKey').value.trim();
      const resultDiv = document.getElementById('result');
      const resultContent = document.getElementById('resultContent');
      
      if (!url || !key) {
        showResult('请填写完整的URL和密钥', 'error');
        return;
      }
      
      try {
        showResult('正在测试连接...', 'loading');
        
        // 创建Supabase客户端
        supabase = window.supabase.createClient(url, key);
        
        // 测试1: 基本连接
        console.log('测试1: 基本连接');
        const { data: healthCheck, error: healthError } = await supabase
          .from('inventory_data')
          .select('count')
          .limit(1);
          
        if (healthError && healthError.code !== 'PGRST116') {
          throw new Error(`连接失败: ${healthError.message}`);
        }
        
        // 测试2: 表结构检查
        console.log('测试2: 表结构检查');
        const { data: tableData, error: tableError } = await supabase
          .from('inventory_data')
          .select('*')
          .limit(1);
          
        if (tableError && tableError.code !== 'PGRST116') {
          throw new Error(`表结构错误: ${tableError.message}`);
        }
        
        // 测试3: 写入权限
        console.log('测试3: 写入权限');
        const testData = {
          id: 1,
          data: [{test: true, timestamp: new Date().toISOString()}],
          images: {test: 'test_image_data'}
        };
        
        const { data: insertData, error: insertError } = await supabase
          .from('inventory_data')
          .upsert(testData);
          
        if (insertError) {
          throw new Error(`写入权限错误: ${insertError.message}`);
        }
        
        // 测试4: 读取权限
        console.log('测试4: 读取权限');
        const { data: readData, error: readError } = await supabase
          .from('inventory_data')
          .select('*')
          .eq('id', 1)
          .single();
          
        if (readError) {
          throw new Error(`读取权限错误: ${readError.message}`);
        }
        
        // 所有测试通过
        const successMessage = `
          <div class="space-y-2">
            <div class="flex items-center text-green-600">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
              </svg>
              <span class="font-semibold">连接成功！</span>
            </div>
            <div class="text-sm text-gray-600">
              <p>✅ 基本连接正常</p>
              <p>✅ 数据表结构正确</p>
              <p>✅ 读写权限正常</p>
              <p>✅ 数据同步功能可用</p>
            </div>
            <div class="mt-4 p-3 bg-blue-50 rounded border-l-4 border-blue-400">
              <p class="text-sm text-blue-700">
                <strong>下一步：</strong>将这些配置复制到主应用的 index.html 文件中
              </p>
            </div>
          </div>
        `;
        
        showResult(successMessage, 'success');
        
      } catch (error) {
        console.error('测试失败:', error);
        const errorMessage = `
          <div class="space-y-2">
            <div class="flex items-center text-red-600">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
              </svg>
              <span class="font-semibold">连接失败</span>
            </div>
            <div class="text-sm text-gray-600">
              <p><strong>错误信息：</strong>${error.message}</p>
            </div>
            <div class="mt-4 p-3 bg-yellow-50 rounded border-l-4 border-yellow-400">
              <p class="text-sm text-yellow-700">
                <strong>检查项目：</strong>
              </p>
              <ul class="list-disc list-inside mt-2 text-sm text-yellow-700">
                <li>URL和密钥是否正确</li>
                <li>是否已执行 supabase-setup.sql</li>
                <li>网络连接是否正常</li>
                <li>Supabase项目是否处于活跃状态</li>
              </ul>
            </div>
          </div>
        `;
        
        showResult(errorMessage, 'error');
      }
    }
    
    function showResult(content, type) {
      const resultDiv = document.getElementById('result');
      const resultContent = document.getElementById('resultContent');
      
      resultDiv.className = `p-4 rounded-md ${
        type === 'success' ? 'bg-green-50 border border-green-200' :
        type === 'error' ? 'bg-red-50 border border-red-200' :
        type === 'loading' ? 'bg-blue-50 border border-blue-200' :
        'bg-gray-50 border border-gray-200'
      }`;
      
      if (type === 'loading') {
        resultContent.innerHTML = `
          <div class="flex items-center text-blue-600">
            <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>${content}</span>
          </div>
        `;
      } else {
        resultContent.innerHTML = content;
      }
      
      resultDiv.classList.remove('hidden');
    }
    
    // 页面加载时尝试从localStorage读取之前的配置
    document.addEventListener('DOMContentLoaded', function() {
      const savedUrl = localStorage.getItem('test_supabase_url');
      const savedKey = localStorage.getItem('test_supabase_key');
      
      if (savedUrl) {
        document.getElementById('supabaseUrl').value = savedUrl;
      }
      if (savedKey) {
        document.getElementById('supabaseKey').value = savedKey;
      }
      
      // 保存配置到localStorage
      document.getElementById('supabaseUrl').addEventListener('input', function(e) {
        localStorage.setItem('test_supabase_url', e.target.value);
      });
      
      document.getElementById('supabaseKey').addEventListener('input', function(e) {
        localStorage.setItem('test_supabase_key', e.target.value);
      });
    });
  </script>
</body>
</html>
